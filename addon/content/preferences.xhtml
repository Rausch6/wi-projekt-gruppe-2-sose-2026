<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <html:section class="zaia-pref-section">
    <html:h3 data-l10n-id="pref-kisski-section-title"></html:h3>
  </html:section>

  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-api-key"
      data-l10n-id="pref-kisski-api-key"
    ></html:label>
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-api-key"
      preference="apiKey"
      autocomplete="off"
    ></html:input>
  </vbox>

  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-base-url"
      data-l10n-id="pref-kisski-base-url"
    ></html:label>
    <html:input
      type="url"
      id="zotero-prefpane-__addonRef__-base-url"
      preference="baseUrl"
    ></html:input>
  </vbox>

  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-model"
      data-l10n-id="pref-kisski-model"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-model"
      preference="model"
      list="__addonRef__-model-options"
    ></html:input>
    <html:datalist id="__addonRef__-model-options"></html:datalist>
  </vbox>

  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-max-items"
      data-l10n-id="pref-max-items"
    ></html:label>
    <html:input
      type="number"
      min="1"
      max="200"
      id="zotero-prefpane-__addonRef__-max-items"
      preference="maxItems"
    ></html:input>
  </vbox>

  <html:section class="zaia-pref-section">
    <html:h3 data-l10n-id="pref-chat-section-title"></html:h3>
  </html:section>

  <vbox>
    <html:label class="zaia-pref-checkbox">
      <html:input
        type="checkbox"
        id="zotero-prefpane-__addonRef__-auto-delete-old-chats"
        preference="autoDeleteOldChats"
      ></html:input>
      <html:span data-l10n-id="pref-auto-delete-old-chats"></html:span>
    </html:label>
  </vbox>

  <hbox align="center">
    <button
      id="zotero-prefpane-__addonRef__-load-models"
      data-l10n-id="pref-load-models"
    />
    <html:span id="zotero-prefpane-__addonRef__-connection-status"></html:span>
  </hbox>

  <html:section class="zaia-pref-section">
    <html:h3 data-l10n-id="pref-ollama-section-title"></html:h3>
  </html:section>

  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-ollama-base-url"
      data-l10n-id="pref-ollama-base-url"
    ></html:label>
    <html:input
      type="url"
      id="zotero-prefpane-__addonRef__-ollama-base-url"
      preference="ollamaBaseUrl"
    ></html:input>
  </vbox>

  <vbox>
    <html:label
      for="zotero-prefpane-__addonRef__-ollama-model"
      data-l10n-id="pref-ollama-model"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-ollama-model"
      preference="ollamaModel"
    ></html:input>
  </vbox>
</groupbox>
<vbox>
  <html:p data-l10n-id="pref-api-key-notice"></html:p>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>

<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/global.css" type="text/css"?>
<!DOCTYPE html>

<html
  xmlns="http://www.w3.org/1999/xhtml"
  windowtype="__addonRef__-index-manager-window"
>
  <head>
    <meta charset="utf-8" />
    <title data-l10n-id="index-manager-title">ZAIA Index Manager</title>
    <style>
      :root {
        color-scheme: light dark;
        min-height: 600px;
        min-width: 800px;
        --zaia-bg: Canvas;
        --zaia-surface: -moz-Dialog;
        --zaia-surface-soft: color-mix(in srgb, CanvasText 4%, Canvas);
        --zaia-border: color-mix(in srgb, CanvasText 18%, transparent);
        --zaia-border-strong: color-mix(in srgb, CanvasText 28%, transparent);
        --zaia-text: CanvasText;
        --zaia-muted: color-mix(in srgb, CanvasText 64%, transparent);
        --zaia-selected: color-mix(in srgb, AccentColor 18%, transparent);
        --zaia-selected-border: color-mix(
          in srgb,
          AccentColor 55%,
          var(--zaia-border)
        );
        --zaia-warning: color-mix(in srgb, #b45309 18%, Canvas);
        --zaia-danger: color-mix(in srgb, #b91c1c 16%, Canvas);
        --zaia-success: color-mix(in srgb, #047857 14%, Canvas);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        min-height: 600px;
        min-width: 800px;
      }

      body {
        margin: 0;
        padding: 0;
        background: var(--zaia-bg);
        color: var(--zaia-text);
        font: message-box;
        height: 100vh;
        overflow: hidden;
      }

      .index-manager-window {
        height: 100vh;
        min-height: 600px;
        min-width: 800px;
        width: 100vw;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
      }

      .window-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 20px 24px 18px;
        border-bottom: 1px solid var(--zaia-border);
        background: var(--zaia-surface);
      }

      .window-title {
        margin: 0;
        font-size: 1.34rem;
        font-weight: 650;
        letter-spacing: 0;
      }

      .header-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .window-content {
        display: grid;
        grid-template-rows: auto auto minmax(220px, 1fr);
        grid-template-areas:
          "filters"
          "status"
          "board";
        gap: 20px;
        padding: 24px;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .filter-strip {
        grid-area: filters;
        display: grid;
        grid-template-columns:
          minmax(220px, 1.7fr) minmax(150px, 1fr)
          minmax(130px, 0.7fr);
        gap: 16px;
        align-items: end;
      }

      .filter-field {
        display: grid;
        gap: 8px;
      }

      .filter-field label {
        font-weight: 650;
      }

      .filter-field input,
      .filter-field select {
        width: 100%;
        min-height: 30px;
      }

      .action-status {
        grid-area: status;
        min-height: 22px;
        padding: 9px 12px;
        border: 1px solid transparent;
        border-radius: 6px;
        color: var(--zaia-muted);
        background: var(--zaia-surface-soft);
      }

      .action-status:empty {
        display: none;
      }

      .action-status.success {
        color: CanvasText;
        border-color: color-mix(in srgb, #047857 30%, transparent);
        background: var(--zaia-success);
      }

      .action-status.warning {
        color: CanvasText;
        border-color: color-mix(in srgb, #b45309 34%, transparent);
        background: var(--zaia-warning);
      }

      .action-status.error {
        color: CanvasText;
        border-color: color-mix(in srgb, #b91c1c 34%, transparent);
        background: var(--zaia-danger);
      }

      .index-board {
        grid-area: board;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        gap: 18px;
        align-items: stretch;
        height: 100%;
        min-height: 0;
      }

      .index-panel {
        height: 100%;
        min-height: 0;
        border: 1px solid var(--zaia-border);
        border-radius: 7px;
        background: var(--zaia-surface);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        overflow: hidden;
      }

      .panel-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 18px 18px 14px;
        border-bottom: 1px solid var(--zaia-border);
      }

      .panel-title {
        margin: 0;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0;
      }

      .panel-count {
        color: var(--zaia-muted);
        white-space: nowrap;
      }

      .paper-list-wrap {
        position: relative;
        min-height: 0;
        overflow: hidden;
      }

      .paper-list {
        height: 100%;
        min-height: 0;
        overflow: auto;
        padding: 16px;
        display: grid;
        align-content: start;
        gap: 12px;
      }

      .paper-row {
        width: 100%;
        min-height: 72px;
        text-align: left;
        border: 1px solid var(--zaia-border);
        border-radius: 6px;
        background: var(--zaia-bg);
        color: var(--zaia-text);
        padding: 12px 14px;
        display: grid;
        gap: 7px;
        cursor: default;
        min-width: 0;
        overflow: hidden;
      }

      .paper-row:hover {
        border-color: var(--zaia-border-strong);
        background: var(--zaia-surface-soft);
      }

      .paper-row.selected {
        border-color: var(--zaia-selected-border);
        background: var(--zaia-selected);
      }

      .paper-row.is-queued {
        opacity: 0.72;
      }

      .paper-row:disabled {
        color: var(--zaia-text);
      }

      .paper-row-title {
        display: block;
        font-weight: 650;
        line-height: 1.35;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .paper-row-meta {
        color: var(--zaia-muted);
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .transfer-controls {
        align-self: center;
        display: grid;
        gap: 12px;
        padding: 0 2px;
      }

      .transfer-controls button {
        min-width: 40px;
        min-height: 32px;
        font-size: 1.18rem;
        line-height: 1;
      }

      .empty-state {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        line-height: 1.35;
        color: var(--zaia-muted);
        pointer-events: none;
      }

      .empty-state[hidden] {
        display: none;
      }

      @media (max-width: 760px) {
        .window-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .header-actions {
          justify-content: flex-start;
        }

        .filter-strip {
          grid-template-columns: 1fr;
        }

        .index-board {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(180px, 1fr) auto minmax(180px, 1fr);
          gap: 16px;
          overflow-y: auto;
        }

        .index-panel {
          height: 100%;
          min-height: 0;
        }

        .transfer-controls {
          justify-self: center;
          grid-template-columns: repeat(2, auto);
        }
      }
    </style>
    <script type="application/javascript">
      <![CDATA[
        (function () {
          var didUnload = false;

          function getDialogArguments() {
            return window.arguments && window.arguments[0]
              ? window.arguments[0]
              : {};
          }

          function getOwnerWindow() {
            var args = getDialogArguments();
            return args.owner || window.opener || null;
          }

          function getPlugin() {
            var owner = getOwnerWindow();
            var args = getDialogArguments();
            var addonInstance = args.addonInstance || "__addonInstance__";

            return owner && owner.Zotero && owner.Zotero[addonInstance]
              ? owner.Zotero[addonInstance]
              : null;
          }

          function callPluginHook(name) {
            var plugin = getPlugin();
            var hook = plugin && plugin.hooks && plugin.hooks[name];

            if (typeof hook !== "function") {
              return false;
            }

            hook({ owner: getOwnerWindow(), window: window });
            return true;
          }

          window.addEventListener(
            "DOMContentLoaded",
            function () {
              callPluginHook("onIndexManagerWindowLoad");
            },
            { once: true },
          );

          window.addEventListener(
            "unload",
            function () {
              if (didUnload) return;
              didUnload = true;
              callPluginHook("onIndexManagerWindowUnload");
            },
            { once: true },
          );
        })();
      ]]>
    </script>
  </head>
  <body>
    <div class="index-manager-window">
      <header class="window-header">
        <h1 class="window-title" data-l10n-id="index-manager-title">
          ZAIA Index Manager
        </h1>
        <div class="header-actions">
          <button
            id="btn-rebuild-index"
            data-l10n-id="index-manager-rebuild-index"
          >
            Index neu aufbauen
          </button>
          <button id="btn-clear-index" data-l10n-id="index-manager-clear-index">
            Index leeren
          </button>
          <button id="btn-refresh" data-l10n-id="index-manager-refresh">
            Liste aktualisieren
          </button>
        </div>
      </header>

      <main class="window-content">
        <section class="filter-strip" aria-label="Index-Filter">
          <div class="filter-field">
            <label for="index-search-input" data-l10n-id="index-manager-search"
              >Suche</label
            >
            <input
              id="index-search-input"
              type="search"
              placeholder="Titel, Autor oder Jahr suchen"
              autocomplete="off"
            />
          </div>
          <div class="filter-field">
            <label
              for="index-type-filter"
              data-l10n-id="index-manager-filter-type"
              >Typ</label
            >
            <select id="index-type-filter"></select>
          </div>
          <div class="filter-field">
            <label
              for="index-year-filter"
              data-l10n-id="index-manager-filter-year"
              >Jahr</label
            >
            <select id="index-year-filter"></select>
          </div>
        </section>

        <div
          id="index-action-status"
          class="action-status"
          role="status"
          aria-live="polite"
        ></div>

        <section
          class="index-board"
          aria-label="Indexierte und nicht indexierte Paper"
        >
          <section class="index-panel" aria-labelledby="unindexed-panel-title">
            <div class="panel-header">
              <h2
                id="unindexed-panel-title"
                class="panel-title"
                data-l10n-id="index-manager-unindexed-title"
              >
                Nicht indexiert
              </h2>
              <span id="unindexed-count" class="panel-count">0</span>
            </div>
            <div class="paper-list-wrap">
              <div
                id="unindexed-list"
                class="paper-list"
                role="listbox"
                aria-multiselectable="true"
              ></div>
              <div id="unindexed-empty" class="empty-state">
                Keine passenden nicht indexierten Paper.
              </div>
            </div>
          </section>

          <div class="transfer-controls" aria-label="Paper verschieben">
            <button
              id="btn-index-selected"
              title="Ausgewählte Paper indexieren"
              aria-label="Ausgewählte Paper indexieren"
            >
              →
            </button>
            <button
              id="btn-unindex-selected"
              title="Ausgewählte Paper aus dem Index entfernen"
              aria-label="Ausgewählte Paper aus dem Index entfernen"
            >
              ←
            </button>
          </div>

          <section class="index-panel" aria-labelledby="indexed-panel-title">
            <div class="panel-header">
              <h2
                id="indexed-panel-title"
                class="panel-title"
                data-l10n-id="index-manager-indexed-title"
              >
                Indexiert
              </h2>
              <span id="indexed-count" class="panel-count">0</span>
            </div>
            <div class="paper-list-wrap">
              <div
                id="indexed-list"
                class="paper-list"
                role="listbox"
                aria-multiselectable="true"
              ></div>
              <div id="indexed-empty" class="empty-state">
                Keine passenden indexierten Paper.
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>
  </body>
</html>
